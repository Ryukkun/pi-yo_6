[project]
name = "pi-yo-6"
version = "0.1.0"
description = "Discord TTS Bot (ピーよ6号)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.5",
    "alkana>=0.0.3",
    "davey>=0.1.5,<0.2.0",
    "discord-py[voice]>=2.7.0",
    "numpy>=2.4.2",
    "pyahocorasick>=2.3.0",
    "pydantic>=2.12.5",
    "pyopenjtalk-plus[onnxruntime]>=0.4.1.post7",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "pyright>=1.1.380",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "SIM102"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
